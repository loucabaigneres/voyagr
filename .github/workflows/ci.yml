name: Pipeline CI

on:
  push:
    branches-ignore:
      - main

jobs:
  quality-check:
    name: Quality Check (Monorepo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: pnpm configuration
        uses: pnpm/action-setup@v6
      
      - name: Node.js configuration
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Turbo Cache
        uses: turbo-actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ github.job }}-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter="!website"

      - name: Global verifications via Turbo
        run: pnpx turbo run format lint typecheck build --filter=@voyagr/api --filter=@voyagr/web
